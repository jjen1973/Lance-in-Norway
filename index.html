<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NORWAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="lightbox.js" defer></script>
  </head>
  <body>
    <main class="poster">
      <section class="hero">
        <p class="eyebrow">Lance's Trip Visual</p>
        <h1>NORWAY</h1>
        <p class="intro">
          A sharp snapshot wall from Norway: waterfalls, wild color, carved
          wood, and high country air.
        </p>
      </section>

      <section class="mosaic" aria-label="Photo collage from the trip">
        <figure class="card tall accent-a">
          <button
            class="photo-frame video-frame"
            type="button"
            data-video-src="Seath feast your eyes on Norway-fixed.mp4"
            data-video-title="Seath: Feast Your Eyes on Norway"
            aria-label="Play Norway video"
          >
            <img
              src="assets/climbing-rooks.jpg"
              alt="Climbing among steep Norwegian rock faces"
            />
          </button>
          <figcaption>Climbing Rocks</figcaption>
        </figure>
        <figure class="card wide accent-b">
          <a
            class="photo-frame"
            href="assets/rainbow.jpg"
            aria-label="Open Rainbow full size"
            data-title="Rainbow"
          >
            <img
              src="assets/rainbow.jpg"
              alt="A rainbow stretching over the Norwegian landscape"
            />
          </a>
          <figcaption>Rainbow</figcaption>
        </figure>
        <figure class="card accent-c">
          <a
            class="photo-frame"
            href="assets/flat-rock.jpg"
            aria-label="Open Flat Rock full size"
            data-title="Flat Rock"
          >
            <img
              src="assets/flat-rock.jpg"
              alt="A broad flat rock overlooking the scenery"
            />
          </a>
          <figcaption>Flat Rock</figcaption>
        </figure>
        <figure class="card accent-d">
          <a
            class="photo-frame"
            href="assets/waterfall.jpg"
            aria-label="Open Waterfall full size"
            data-title="Waterfall"
          >
            <img
              src="assets/waterfall.jpg"
              alt="A waterfall cutting through the Norway landscape"
            />
          </a>
          <figcaption>Waterfall</figcaption>
        </figure>
        <figure class="card accent-e">
          <a
            class="photo-frame"
            href="assets/water.jpg"
            aria-label="Open Water full size"
            data-title="Water"
          >
            <img
              src="assets/water.jpg"
              alt="Water reflecting the light on the trip"
            />
          </a>
          <figcaption>Water</figcaption>
        </figure>
        <figure class="card accent-f">
          <a
            class="photo-frame"
            href="assets/wooden-cups.jpg"
            aria-label="Open Wooden Cups full size"
            data-title="Wooden Cups"
          >
            <img
              src="assets/wooden-cups.jpg"
              alt="Wooden cups captured during the trip"
            />
          </a>
          <figcaption>Wooden Cups</figcaption>
        </figure>
        <figure class="card accent-g">
          <a
            class="photo-frame"
            href="assets/flower.jpg"
            aria-label="Open Flower full size"
            data-title="Flower"
          >
            <img
              src="assets/flower.jpg"
              alt="A flower in close detail during the trip"
            />
          </a>
          <figcaption>Flower</figcaption>
        </figure>
        <figure class="card accent-h">
          <a
            class="photo-frame"
            href="assets/flower2.jpg"
            aria-label="Open Flower 2 full size"
            data-title="Flower 2"
          >
            <img
              src="assets/flower2.jpg"
              alt="A second floral moment from Norway"
            />
          </a>
          <figcaption>Flower 2</figcaption>
        </figure>
      </section>

      <footer class="page-footer">
        <p>Made by Mom</p>
      </footer>
    </main>

    <div class="lightbox" hidden aria-hidden="true">
      <button
        class="lightbox-close"
        type="button"
        aria-label="Close full-size photo"
      >
        Close
      </button>
      <figure class="lightbox-panel">
        <img class="lightbox-image" src="" alt="" />
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
    </div>

    <div class="video-modal" hidden aria-hidden="true">
      <div class="video-modal-panel">
        <button
          class="video-modal-close"
          type="button"
          aria-label="Close video"
        >
          Close
        </button>
        <video
          class="video-player"
          controls
          playsinline
          preload="metadata"
          autoplay
          muted
          poster="assets/climbing-rooks.jpg"
        >
          <source src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <p class="video-modal-caption"></p>
      </div>
    </div>
  </body>
</html>
